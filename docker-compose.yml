services:
  postgres:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    container_name: ogt-postgres
    environment:
      POSTGRES_DB: onlygoodthings
      POSTGRES_USER: ogt
      POSTGRES_PASSWORD: ogt_dev_change_me
    ports:
      - "5432:5432"
    volumes:
      - ogt_pg_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogt -d onlygoodthings"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ogt-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ogt_redis_data:/data

volumes:
  ogt_pg_data:
  ogt_redis_data:
