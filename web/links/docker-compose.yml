services:
  links:
    image: nginx:1.28-alpine
    container_name: ogt-links
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.ogt-acme.entrypoints=websecure
      - traefik.http.routers.ogt-acme.priority=10000
      - traefik.http.routers.ogt-acme.rule=(Host(`onlygoodthings.lat`) || Host(`www.onlygoodthings.lat`)) && PathPrefix(`/.well-known/acme-challenge/`)
      - traefik.http.routers.ogt-acme.service=acme-http@internal
      - traefik.http.routers.ogt-acme.tls=true
      - traefik.http.routers.ogt-public.entrypoints=websecure
      - traefik.http.routers.ogt-public.rule=Host(`onlygoodthings.lat`) || Host(`www.onlygoodthings.lat`)
      - traefik.http.routers.ogt-public.tls.certresolver=le
      - traefik.http.services.ogt.loadbalancer.server.port=80

networks:
  edge:
    external: true
