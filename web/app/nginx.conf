server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  client_max_body_size 32m;

  location = /.well-known/apple-app-site-association { default_type application/json; }
  location = /.well-known/assetlinks.json { default_type application/json; }
  location = /apple-app-site-association { default_type application/json; }
  location /h/ { try_files /honor.html =404; }
  location /p/ { try_files /honor.html =404; }
  location /join/ { try_files /join.html =404; }
  location = /privacy { try_files /privacy.html =404; }
  location = /privacy.html { try_files /privacy.html =404; }
  location = /terms { try_files /terms.html =404; }
  location = /terms.html { try_files /terms.html =404; }
  location = /terminos { try_files /terms.html =404; }
  location = /uso { try_files /terms.html =404; }
  location = /borrar-cuenta { try_files /borrar-cuenta.html =404; }
  location = /borrar-cuenta.html { try_files /borrar-cuenta.html =404; }
  location = /eliminar-cuenta { try_files /borrar-cuenta.html =404; }

  # A missing CRM or JS module must never be answered with the public SPA.
  location = /crm { return 308 /crm/control/; }
  location = /crm/control { return 308 /crm/control/; }
  location = /crm/empresas { return 308 /crm/empresas/; }
  location ^~ /crm/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /release.json {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  location /api/ {
    proxy_pass http://ogt-api:8080;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ^~ /media/ {
    proxy_pass http://ogt-api:8080;
    proxy_set_header Host $host;
  }
  location /health { proxy_pass http://ogt-api:8080; }
  location /ws {
    proxy_pass http://ogt-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
  location /db {
    proxy_pass http://ogt-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
  # Return real 404s for absent static assets, never index.html with status 200.
  location ~* \.(css|js|mjs|map|json|woff2?|ttf|otf|png|jpe?g|gif|webp|ico|svg|mp4|webm)$ {
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location / { try_files $uri $uri/ /index.html; }
}
