<!doctype html><html lang="es" data-crm="control"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>OGT Control — Acceso protegido</title><style>body{font:16px system-ui;margin:0;background:#f6f7f8;color:#111213}main{max-width:960px;margin:8vh auto;padding:32px;background:#fff;border:1px solid #e5e7eb;border-radius:18px}h1{margin:0 0 10px}p{line-height:1.5}input,button{padding:12px;border-radius:8px;border:1px solid #ccd1d5;font:inherit}button{background:#0d3d4d;color:#fff;cursor:pointer}form{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}#crm-root p{padding:8px;border-bottom:1px solid #eee}#crm-status{color:#405660}[hidden]{display:none!important}.crm-google-button{display:inline-flex;align-items:center;justify-content:center;gap:9px;vertical-align:middle}.crm-google-mark{width:20px;height:20px;flex:none;vertical-align:middle;margin-right:5px}.crm-google-button>.crm-google-mark{margin:0}.crm-password-wrap{position:relative;display:inline-flex;align-items:center;min-width:200px}.crm-password-wrap>input{min-width:0;width:100%;padding-right:48px}.crm-password-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:transparent;color:#354b59;border:0}.crm-password-eye svg{width:21px;height:21px;pointer-events:none}.crm-eye-slash{display:none}.crm-password-eye[aria-pressed=true] .crm-eye-slash{display:block}</style></head><body><main><h1>OGT Control</h1><p>Administración central · Acceso restringido</p><p id="crm-status" role="status"></p><form id="crm-login" hidden><input id="email" type="email" placeholder="Correo" aria-label="Correo" required autocomplete="username"><input id="password" type="password" placeholder="Contraseña" aria-label="Contraseña" required autocomplete="current-password"><button>Ingresar</button></form><button id="crm-refresh">Verificar nuevamente</button><section id="crm-root"></section><p>Para ingresar necesitás una cuenta autorizada, correo verificado y verificación de dos pasos reciente. <img src="/google-logo.svg" width="17" height="17" class="crm-google-mark" alt="">Google y contraseña pueden vincularse a una misma cuenta.</p></main><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script><script src="../crm.js"></script></body></html>
