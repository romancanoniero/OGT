<!doctype html><html lang="es" data-crm="control"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>OGT Control — Acceso protegido</title><style>body{font:16px system-ui;margin:0;background:#f6f7f8;color:#111213}main{max-width:960px;margin:8vh auto;padding:32px;background:#fff;border:1px solid #e5e7eb;border-radius:18px}h1{margin:0 0 10px}p{line-height:1.5}input,button{padding:12px;border-radius:8px;border:1px solid #ccd1d5;font:inherit}button{background:#0d3d4d;color:#fff;cursor:pointer}form{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}#crm-root p{padding:8px;border-bottom:1px solid #eee}#crm-status{color:#405660}[hidden]{display:none!important}</style></head><body><main><h1>OGT Control</h1><p>Administración central · Acceso restringido</p><p id="crm-status" role="status"></p><form id="crm-login" hidden><input id="email" type="email" placeholder="Correo" aria-label="Correo" required autocomplete="username"><input id="password" type="password" placeholder="Contraseña" aria-label="Contraseña" required autocomplete="current-password"><button>Ingresar</button></form><button id="crm-refresh">Verificar nuevamente</button><section id="crm-root"></section><p>Para ingresar necesitás una cuenta expresamente autorizada y autenticación multifactor reciente.</p></main><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script><script src="../crm.js"></script></body></html>
