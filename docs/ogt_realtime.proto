syntax = "proto3";
package ogt.realtime;

enum FrameType {
  CONNECT_AUTH = 0;
  PARKING_BROADCAST = 1;
  PARKING_CLAIM = 2;
  LOCATION_TICK = 3;
  IMPACT_ALERT = 4;
  HEARTBEAT = 5;
  ACK = 6;
  ERROR = 7;
}

message Envelope {
  FrameType type = 1;
  string request_id = 2;
  string channel = 3;
  int64 sent_at_epoch_ms = 4;
  bytes payload = 5;
}

message ConnectAuth {
  string firebase_jwt = 1;
  string initial_channel = 2;
  string client_version = 3;
  string device_platform = 4;
}

message ParkingBroadcast {
  string spot_id = 1;
  string owner_user_id = 2;
  double latitude = 3;
  double longitude = 4;
  int64 expires_at_epoch_ms = 5;
  int32 reward_points = 6;
  string notes = 7;
}

message ParkingClaim {
  string spot_id = 1;
  int32 expected_version = 2;
  double claimant_latitude = 3;
  double claimant_longitude = 4;
}

message LocationTick {
  string spot_id = 1;
  string user_id = 2;
  string role = 3;
  double latitude = 4;
  double longitude = 5;
  double speed_mps = 6;
  double heading_degrees = 7;
  int64 recorded_at_epoch_ms = 8;
}

message ImpactAlert {
  string alert_id = 1;
  string kind = 2;
  string title = 3;
  string body = 4;
  double latitude = 5;
  double longitude = 6;
  int32 radius_meters = 7;
  string urgency = 8;
  string deep_link = 9;
}
