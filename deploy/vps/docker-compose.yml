services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ogt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: onlygoodthings
      POSTGRES_USER: ${OGT_DB_USER:-ogt}
      POSTGRES_PASSWORD: ${OGT_DB_PASSWORD}
    volumes:
      - ogt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogt -d onlygoodthings"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ogt]
  redis:
    image: redis:7-alpine
    container_name: ogt-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ogt_redis_data:/data
    networks: [ogt]
  api:
    build: .
    image: ogt-backend:local
    container_name: ogt-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: "8080"
      OGT_JDBC_URL: jdbc:postgresql://postgres:5432/onlygoodthings
      OGT_REDIS_URL: redis://redis:6379
      OGT_MEDIA_DIR: /app/media
      OGT_PUBLIC_BASE: https://onlygoodthings.lat
    volumes:
      - ./media:/app/media
      - ./operations:/run/ogt-operations:ro
      - /home/iankmp/ogt-secrets/firebase-admin.json:/run/secrets/ogt-firebase-admin.json:ro
      - /home/iankmp/ogt-secrets/mercadopago:/run/secrets/mercadopago:ro
    ports: ["127.0.0.1:19080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [ogt]
  web:
    image: nginx:1.28-alpine
    container_name: ogt-web
    restart: unless-stopped
    volumes:
      - ./web-app:/usr/share/nginx/html:ro
      - ./web-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:19081:80"]
    depends_on: [api]
    networks: [ogt, edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.ogt-web.entrypoints=websecure
      - traefik.http.routers.ogt-web.rule=Host(`onlygoodthings.lat`) || Host(`www.onlygoodthings.lat`)
      - traefik.http.routers.ogt-web.tls.certresolver=le
      - traefik.http.routers.ogt-web.priority=20
      - traefik.http.services.ogt-web.loadbalancer.server.port=80
      # Same installation, temporarily restricted to the reviewer's networks.
      # No forwarded-header IP strategy: do not trust client-supplied X-Forwarded-For.
      - traefik.http.routers.ogt-web.middlewares=ogt-prelaunch@docker
      # Temporary store review access authenticates exact, expiring Firebase UIDs.
      # The original router, IP gate and all CRM paths remain unchanged.
      - traefik.http.routers.ogt-store-review.entrypoints=websecure
      - traefik.http.routers.ogt-store-review.rule=Host(`onlygoodthings.lat`) && (PathPrefix(`/store-review/api/v1/`) || PathPrefix(`/store-review/media/`)) && !PathPrefix(`/store-review/api/v1/crm`) && !PathPrefix(`/store-review/api/v1/payments`)
      - traefik.http.routers.ogt-store-review.tls.certresolver=le
      - traefik.http.routers.ogt-store-review.priority=90
      - traefik.http.routers.ogt-store-review.service=ogt-web
      - traefik.http.routers.ogt-store-review.middlewares=ogt-review-auth@docker,ogt-review-strip@docker
      - traefik.http.middlewares.ogt-review-auth.forwardauth.address=http://ogt-web/internal/store-review/authorize
      - traefik.http.middlewares.ogt-review-auth.forwardauth.authRequestHeaders=Authorization
      - traefik.http.middlewares.ogt-review-auth.forwardauth.trustForwardHeader=false
      - traefik.http.middlewares.ogt-review-strip.stripprefix.prefixes=/store-review
      # WebSocket credentials are checked in the auth frame before any data/listen.
      - traefik.http.routers.ogt-store-review-db.entrypoints=websecure
      - traefik.http.routers.ogt-store-review-db.rule=Host(`onlygoodthings.lat`) && Path(`/store-review/db`) && Method(`GET`)
      - traefik.http.routers.ogt-store-review-db.tls.certresolver=le
      - traefik.http.routers.ogt-store-review-db.priority=90
      - traefik.http.routers.ogt-store-review-db.service=ogt-web
      - traefik.http.routers.ogt-store-review-db.middlewares=ogt-review-db-rate@docker,ogt-review-db-connections@docker
      - traefik.http.middlewares.ogt-review-db-rate.ratelimit.average=5
      - traefik.http.middlewares.ogt-review-db-rate.ratelimit.burst=20
      - traefik.http.middlewares.ogt-review-db-connections.inflightreq.amount=30
      # Public brand information, legal documents and app-link proofs only.
      # Exact paths and read methods only; app, CRM, API and assets keep the gate.
      - traefik.http.routers.ogt-legal.entrypoints=websecure
      - traefik.http.routers.ogt-legal.rule=(Host(`onlygoodthings.lat`) || Host(`www.onlygoodthings.lat`)) && (Path(`/google1f7c28da93f20e7c.html`) || Path(`/presentacion`) || Path(`/presentacion.html`) || Path(`/privacy`) || Path(`/privacy.html`) || Path(`/terms`) || Path(`/terms.html`) || Path(`/terminos`) || Path(`/uso`) || Path(`/borrar-cuenta`) || Path(`/borrar-cuenta.html`) || Path(`/eliminar-cuenta`) || Path(`/.well-known/apple-app-site-association`) || Path(`/apple-app-site-association`) || Path(`/.well-known/assetlinks.json`)) && (Method(`GET`) || Method(`HEAD`))
      - traefik.http.routers.ogt-legal.tls.certresolver=le
      - traefik.http.routers.ogt-legal.priority=100
      - traefik.http.routers.ogt-legal.service=ogt-web
      # Signed payment notifications remain the only public write endpoint.
      - traefik.http.routers.ogt-mp.entrypoints=websecure
      - traefik.http.routers.ogt-mp.rule=Host(`onlygoodthings.lat`) && Path(`/api/v1/payments/mercadopago/webhook`) && Method(`POST`)
      - traefik.http.routers.ogt-mp.tls.certresolver=le
      - traefik.http.routers.ogt-mp.priority=100
      - traefik.http.routers.ogt-mp.service=ogt-web
      - traefik.http.routers.ogt-mp.middlewares=ogt-mp-rate@docker,ogt-mp-body@docker
      - traefik.http.middlewares.ogt-mp-rate.ratelimit.average=20
      - traefik.http.middlewares.ogt-mp-rate.ratelimit.burst=40
      - traefik.http.middlewares.ogt-mp-body.buffering.maxRequestBodyBytes=65536
      - traefik.http.middlewares.ogt-mp-body.buffering.memRequestBodyBytes=65536
      - traefik.http.middlewares.ogt-prelaunch.ipallowlist.sourcerange=${OGT_PRELAUNCH_CIDRS:-127.0.0.1/32,::1/128}
volumes:
  ogt_pg_data:
  ogt_redis_data:
networks:
  ogt:
    name: ogt
  edge:
    external: true
