<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>OGT · Set autenticación Stitch</title>
  <style>
    :root { --ink: #111213; --muted: #6b7280; --canvas: #ffffff; --sand: #f4f5f7; --navy: #0d3d4d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font-family: "Plus Jakarta Sans", Inter, sans-serif; }
    header { padding: 20px 24px; border-bottom: 1px solid #e5e7eb; }
    h1 { margin: 0; font-size: 20px; letter-spacing: -0.03em; }
    p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    section { padding: 28px 24px; border-bottom: 1px solid #e5e7eb; }
    .n { display: inline-grid; place-items: center; min-width: 28px; height: 28px; margin-right: 8px; background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; }
    img { display: block; width: min(1100px, 100%); height: auto; background: var(--sand); }
  </style>
</head>
<body>
  <header>
    <h1>Set autenticación web — Stitch</h1>
    <p>Still clay a la izquierda, formulario a la derecha. Comentá por número.</p>
  </header>
  <section><p><span class="n">20</span> Portal institucional</p><img src="gate.png" alt="20 portal"></section>
  <section><p><span class="n">02</span> Login</p><img src="login.png" alt="02 login"></section>
  <section><p><span class="n">03</span> Registro</p><img src="registro.png" alt="03 registro"></section>
  <section><p><span class="n">04</span> Recuperar clave</p><img src="recuperar.png" alt="04 recuperar"></section>
  <section><p><span class="n">18</span> Teléfono</p><img src="telefono.png" alt="18 telefono"></section>
  <section><p><span class="n">19</span> Confirmar SMS</p><img src="sms.png" alt="19 sms"></section>
</body>
</html>
