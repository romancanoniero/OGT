<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="100%" height="100%" fill="none">
  <!--
    Quiet Studio Canonical Line Glyph: qs_parking_sign
    - Standard 20x20 optical grid (viewBox="0 0 20 20")
    - Stroke: 1.8px pure ink (#111213)
    - Stroke-linecap: round, Stroke-linejoin: round
    - Traffic parking sign plate: rounded square boundary
    - Center glyph: bold capital letter 'P' drawn via crisp stroke paths
  -->
  <!-- Outer rounded-square parking sign plate -->
  <rect x="2" y="2" width="16" height="16" rx="3.5" stroke="#111213" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Capital letter P stem -->
  <path d="M 7.5 6 L 7.5 14" stroke="#111213" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Capital letter P upper bowl -->
  <path d="M 7.5 6 L 11 6 C 12.4 6 13.5 7.1 13.5 8.5 C 13.5 9.9 12.4 11 11 11 L 7.5 11" stroke="#111213" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>