<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elegí el logo OGT</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f5f7;
      color: #111213;
      font-family: Inter, system-ui, sans-serif;
    }
    header {
      padding: 12px 16px 4px;
    }
    h1 { margin: 0; font-size: 18px; }
    p { margin: 4px 0 0; font-size: 12px; color: #6b7280; }
    h2 {
      margin: 6px 16px 8px;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #5b6570;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      padding: 0 16px 12px;
    }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    a { text-decoration: none; color: inherit; }
    figure {
      margin: 0;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 10px;
    }
    figure:hover { border-color: #0d3d4d; }
    img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #fff;
      display: block;
    }
    figcaption {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }
    figcaption span { display: block; font-weight: 400; color: #6b7280; font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <h1>Elegí el logo — Only Good Things</h1>
    <p>20 propuestas en una página. Tocá una para verla grande y decime el código (B01 o 06).</p>
  </header>

  <h2>Ronda B — paleta del 06 · noticia / acción / solidaridad</h2>
  <div class="grid">
    <a href="ogt-b01-sostener.png"><figure><img src="ogt-b01-sostener.png" alt="B01" /><figcaption>B01 <span>Sostener</span></figcaption></figure></a>
    <a href="ogt-b02-aviso.png"><figure><img src="ogt-b02-aviso.png" alt="B02" /><figcaption>B02 <span>Aviso</span></figcaption></figure></a>
    <a href="ogt-b03-pasar.png"><figure><img src="ogt-b03-pasar.png" alt="B03" /><figcaption>B03 <span>Pasar</span></figcaption></figure></a>
    <a href="ogt-b04-vecinos.png"><figure><img src="ogt-b04-vecinos.png" alt="B04" /><figcaption>B04 <span>Vecinos</span></figcaption></figure></a>
    <a href="ogt-b05-circulo-abierto.png"><figure><img src="ogt-b05-circulo-abierto.png" alt="B05" /><figcaption>B05 <span>Incluir</span></figcaption></figure></a>
    <a href="ogt-b06-sello-bueno.png"><figure><img src="ogt-b06-sello-bueno.png" alt="B06" /><figcaption>B06 <span>Sello</span></figcaption></figure></a>
    <a href="ogt-b07-hilo.png"><figure><img src="ogt-b07-hilo.png" alt="B07" /><figcaption>B07 <span>Hilo</span></figcaption></figure></a>
    <a href="ogt-b08-puente.png"><figure><img src="ogt-b08-puente.png" alt="B08" /><figcaption>B08 <span>Puente</span></figcaption></figure></a>
    <a href="ogt-b09-wordmark-tricolor.png"><figure><img src="ogt-b09-wordmark-tricolor.png" alt="B09" /><figcaption>B09 <span>OGT</span></figcaption></figure></a>
    <a href="ogt-b10-icono-app.png"><figure><img src="ogt-b10-icono-app.png" alt="B10" /><figcaption>B10 <span>Icono</span></figcaption></figure></a>

  <div class="grid">
    <a href="ogt-logo-01-circulos.png"><figure><img src="ogt-logo-01-circulos.png" alt="01" /><figcaption>01 <span>Círculos</span></figcaption></figure></a>
    <a href="ogt-logo-02-arcos.png"><figure><img src="ogt-logo-02-arcos.png" alt="02" /><figcaption>02 <span>Arcos</span></figcaption></figure></a>
    <a href="ogt-logo-03-wordmark.png"><figure><img src="ogt-logo-03-wordmark.png" alt="03" /><figcaption>03 <span>Wordmark</span></figcaption></figure></a>

    <a href="ogt-logo-08-boletin.png"><figure><img src="ogt-logo-08-boletin.png" alt="08" /><figcaption>08 <span>Boletín</span></figcaption></figure></a>
    <a href="ogt-logo-09-ceder.png"><figure><img src="ogt-logo-09-ceder.png" alt="09" /><figcaption>09 <span>Ceder</span></figcaption></figure></a>
    <a href="ogt-logo-10-sello.png"><figure><img src="ogt-logo-10-sello.png" alt="10" /><figcaption>10 <span>Sello ogt</span></figcaption></figure></a>
  </div>
</body>
</html>
