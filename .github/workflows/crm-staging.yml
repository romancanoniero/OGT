name: OGT CRM staging
run-name: OGT CRM staging - ${{ github.event_name }}
on:
  push:
    branches: [main]
    paths: ['.github/crm-staging-request.json']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Publicar la version solicitada, solo en staging'
        required: true
        type: choice
        default: CANCELAR
        options: [CANCELAR, DEPLOY-STAGING]
permissions:
  contents: read
concurrency:
  group: ogt-crm-staging
  cancel-in-progress: false
jobs:
  request:
    if: github.repository == 'romancanoniero/OGT' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate committed staging request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function fail(message) { console.error(`::error::${message}`); process.exit(1); }
          if (process.env.EVENT_NAME === 'workflow_dispatch' && process.env.CONFIRM !== 'DEPLOY-STAGING') fail('Selecciona DEPLOY-STAGING.');
          const request = JSON.parse(fs.readFileSync('.github/crm-staging-request.json', 'utf8'));
          if (request.repository !== 'romancanoniero/OGT' || request.environment !== 'ogt-crm-staging' || request.scope !== 'static-ui-only' || request.confirm !== 'DEPLOY-STAGING' || !/^[0-9a-f]{40}$/.test(request.sourceSha)) fail('Solicitud invalida. No se publica nada.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${request.sourceSha}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Solicitud de staging\nCommit: \`${request.sourceSha}\`\n\nSolo interfaces web. No habilita operaciones sin backend y permisos.\n`);
          NODE
  preflight:
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: romancanoniero/OGT
          ref: ${{ needs.request.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check pinned source, syntax and tests
        env:
          SOURCE_SHA: ${{ needs.request.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          for path in web/app/crm/crm.js web/app/crm/control/index.html web/app/crm/empresas/index.html web/app/app.js web/app/auth.js qa/auth-unit.test.mjs; do
            test -s "$path" || { echo "::error::Falta $path"; exit 1; }
          done
          node --check web/app/app.js
          node --check web/app/auth.js
          find web/app/crm -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          node --test qa/auth-unit.test.mjs
          if compgen -G 'qa/crm-*.test.mjs' >/dev/null; then node --test qa/crm-*.test.mjs; fi
  publish:
    needs: [request, preflight]
    runs-on: ubuntu-latest
    environment: ogt-crm-staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: romancanoniero/OGT
          ref: ${{ needs.request.outputs.source_sha }}
          persist-credentials: false
      - name: Validate staging connection without exposing credentials
        env:
          OGT_STAGING_HOST: ${{ secrets.OGT_STAGING_HOST }}
          OGT_STAGING_USER: ${{ secrets.OGT_STAGING_USER }}
          OGT_STAGING_SSH_KEY: ${{ secrets.OGT_STAGING_SSH_KEY }}
          OGT_STAGING_KNOWN_HOSTS: ${{ secrets.OGT_STAGING_KNOWN_HOSTS }}
          OGT_STAGING_BASE_URL: ${{ vars.OGT_STAGING_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in OGT_STAGING_HOST OGT_STAGING_USER OGT_STAGING_SSH_KEY OGT_STAGING_KNOWN_HOSTS OGT_STAGING_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar $name en ogt-crm-staging. No se intento conectar ni publicar."
              printf -- '- Falta `%s`\n' "$name" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          done
          test "$missing" -eq 0
          [[ "$OGT_STAGING_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo '::error::Host SSH invalido'; exit 1; }
          [[ "$OGT_STAGING_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]] || { echo '::error::Usuario SSH invalido'; exit 1; }
          node -e 'const u=new URL(process.env.OGT_STAGING_BASE_URL);if(u.protocol!=="https:"||u.username||u.password||u.search||u.hash)process.exit(1)'
      - name: Install staging-only SSH identity
        env:
          SSH_KEY: ${{ secrets.OGT_STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OGT_STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Publish only tested web files to the isolated staging directory
        env:
          HOST: ${{ secrets.OGT_STAGING_HOST }}
          USER: ${{ secrets.OGT_STAGING_USER }}
          SOURCE_SHA: ${{ needs.request.outputs.source_sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '{"sourceSha":"%s","scope":"static-ui-only"}\n' "$SOURCE_SHA" > web/app/crm/release.json
          # The server account must be restricted to this staging directory.
          # Never sync to the production web root or alter the database here.
          rsync -az --delay-updates --delete-delay -e 'ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15' \
            web/app/crm/ "$USER@$HOST:ogt-crm-staging/"
      - name: Verify HTTPS pages and exact release
        env:
          BASE_URL: ${{ vars.OGT_STAGING_BASE_URL }}
          SOURCE_SHA: ${{ needs.request.outputs.source_sha }}
        run: |
          set -eu
          base="${BASE_URL%/}"
          for page in control empresas; do
            curl --proto '=https' --fail --silent --show-error --max-time 30 "$base/$page/?release=$SOURCE_SHA" -o "$RUNNER_TEMP/$page.html"
            grep -q 'id="crm-root"' "$RUNNER_TEMP/$page.html"
          done
          curl --proto '=https' --fail --silent --show-error --max-time 30 "$base/release.json?release=$SOURCE_SHA" -o "$RUNNER_TEMP/crm-release.json"
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/crm-release.json")); if(r.sourceSha!==process.env.SOURCE_SHA||r.scope!=="static-ui-only") process.exit(1)'
          {
            printf '## Interfaces publicadas y verificadas\n\n'
            printf 'Codigo: `%s`\n\n' "$SOURCE_SHA"
            printf 'OGT Control: %s/control/\n\n' "$base"
            printf 'OGT Empresas: %s/empresas/\n\n' "$base"
            printf 'Pendiente separado: backend, migraciones, MFA real y autorizacion de cuentas.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
