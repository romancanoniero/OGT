name: OGT - publicacion puntual ojo y registro
"on":
  push:
    branches: [main]
    paths: ['.github/workflows/ogt-one-shot-20261022.yml']
permissions:
  contents: read
concurrency:
  group: ogt-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source checks; no server access
        run: bash scripts/deploy-ogt-vps.sh --check
      - name: Shell syntax
        run: bash -n scripts/deploy-ogt-vps.sh scripts/activate-ogt-release.sh
  browser:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Browser regression with mocked identity and API, not live MFA
        run: python qa/crm-browser.py
      - name: Public entrypoint and missing CRM assets regression (local fixtures)
        run: python qa/crm-entrypoints-browser.py
  publish:
    needs: [checks, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'romancanoniero/OGT' && github.event.head_commit.message == 'deploy: OGT eye 2026-10-22'
    runs-on: ubuntu-latest
    environment: ogt-launch
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ogt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ogt
          persist-credentials: false
      - name: Check deploy and private build dependency configuration
        env:
          HOST: 217.216.82.209
          USER: iankmp
          KEY: ${{ secrets.OGT_VPS_SSH_KEY }}
          KNOWN: ${{ secrets.OGT_VPS_KNOWN_HOSTS }}
          SDK_TOKEN: ${{ secrets.OGT_SDK_CHECKOUT_TOKEN }}
          SDK_REF: 0a881b7a15c9a7d99b77da8547aabe2dd493a8b0
          SSH_PORT: ${{ vars.OGT_VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          for name in HOST USER KEY KNOWN SDK_TOKEN SDK_REF; do
            test -n "${!name}" || { echo "::error::Falta configuracion de ogt-launch: $name. Ver docs/FIRST_RELEASE.md"; exit 1; }
          done
          [[ "$HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          [[ "$SDK_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 && test "$SSH_PORT" -le 65535
      - uses: actions/checkout@v4
        with:
          repository: romancanoniero/db-kmp-sdk
          ref: 0a881b7a15c9a7d99b77da8547aabe2dd493a8b0
          token: ${{ secrets.OGT_SDK_CHECKOUT_TOKEN }}
          path: _sdk
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Android build prerequisites
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Configure verified SSH access to the existing OGT installation
        env:
          HOST: 217.216.82.209
          USER: iankmp
          KEY: ${{ secrets.OGT_VPS_SSH_KEY }}
          KNOWN: ${{ secrets.OGT_VPS_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.OGT_VPS_SSH_PORT || '22' }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ogt-release
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf 'Host ogt-release-target\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/ogt-release\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$HOST" "$USER" "$SSH_PORT" > ~/.ssh/config
      - name: Compile, test, back up, migrate and publish the same version
        env:
          OGT_VPS_HOST: ogt-release-target
          OGT_DB_KMP_SDK_PATH: ${{ github.workspace }}/_sdk
        run: bash scripts/deploy-ogt-vps.sh --deploy
      - name: Verify installed version and API on Contabo
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ogt-release-target \
            'curl -fsS --max-time 20 http://127.0.0.1:19081/release.json' > /tmp/ogt-verified-release.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/ogt-verified-release.json') as stream:
              release = json.load(stream)
          assert release.get('repository') == 'romancanoniero/OGT'
          assert release.get('sourceSha') == os.environ['EXPECTED_SHA']
          assert release.get('scope') == 'app-backend-crms'
          print('VERSION PUBLICADA VERIFICADA:', release['sourceSha'])
          PY
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ogt-release-target \
            'curl -fsS --max-time 20 http://127.0.0.1:19080/health >/dev/null'
          echo 'Backend and integrated release verified'
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/ogt-release ~/.ssh/known_hosts ~/.ssh/config
