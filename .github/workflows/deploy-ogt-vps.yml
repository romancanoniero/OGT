# Publica OGT en la VPS Contabo. Solo a mano.
name: Deploy OGT VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ogt-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout OGT
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout db-kmp-sdk
        uses: actions/checkout@v4
        with:
          repository: romancanoniero/db-kmp-sdk
          token: ${{ secrets.OGT_SDK_CHECKOUT_TOKEN }}
          # SHA validado en el gate local del 20/10/2026.
          ref: 0a881b7a15c9a7d99b77da8547aabe2dd493a8b0
          path: db-kmp-sdk
          persist-credentials: false

      - name: Point Gradle at the SDK checkout
        run: |
          printf '\nogt.dbKmpSdkPath=%s\n' "${GITHUB_WORKSPACE}/db-kmp-sdk" >> gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync

      - name: Load SSH key for Contabo
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.OGT_VPS_SSH_KEY }}

      - name: Trust the VPS host and map iankmp-vps
        env:
          OGT_VPS_KNOWN_HOSTS: ${{ secrets.OGT_VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$OGT_VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
Host iankmp-vps
  HostName 217.216.82.209
  User iankmp
  IdentitiesOnly yes
  BatchMode yes
EOF
          chmod 600 ~/.ssh/config
          # Comprueba el acceso sin imprimir material sensible.
          ssh -o BatchMode=yes -o ConnectTimeout=20 iankmp-vps true

      - name: Deploy with the repo script
        run: bash scripts/deploy-ogt-vps.sh

      - name: Public health check
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 http://217.216.82.209:19080/health
          echo
          curl -fsS -o /dev/null --max-time 20 https://onlygoodthings.lat/
          echo "Public site responded 200"
