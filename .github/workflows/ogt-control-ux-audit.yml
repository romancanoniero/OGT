name: OGT Control - auditoria visual automatica

on:
  workflow_dispatch:
  schedule:
    # Lunes 11:00 UTC = 08:00 de Buenos Aires (sin horario de verano).
    - cron: '0 11 * * 1'

permissions:
  contents: read

concurrency:
  group: ogt-control-ux-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control-ux:
    if: github.repository == 'romancanoniero/OGT'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Playwright and headless Chromium
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Review Control layouts and capture every page
        run: python qa/run_automated_tests.py --ux --output "$RUNNER_TEMP/ogt-control-ux"
      - name: Keep visual report, findings and screenshots even if failing
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ogt-control-visual-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ogt-control-ux/
          if-no-files-found: error
          retention-days: 30
