name: OGT CRM client checks
on:
  push:
    branches: [feature/crm-foundations-20261021]
    paths: ['web/app/crm/**', 'qa/crm-*', '.github/workflows/crm-client.yml']
  pull_request:
    branches: [main]
    paths: ['web/app/crm/**', 'qa/crm-*', '.github/workflows/crm-client.yml']
permissions:
  contents: read
concurrency:
  group: crm-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          find web/app/crm -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          node --test qa/crm-session.test.mjs
  browser:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Mock identity and API regression scenarios (not live Firebase)
        run: python qa/crm-browser.py
