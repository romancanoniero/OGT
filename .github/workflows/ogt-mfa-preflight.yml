name: OGT - Firebase MFA preflight (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ogt-mfa-preflight.yml'
      - 'scripts/ogt_mfa_preflight.py'
      - 'qa/test_ogt_mfa_preflight.py'
  schedule:
    # Daily drift check on the exact existing OGT project.
    - cron: '17 10 * * *'
permissions:
  contents: read
concurrency:
  group: ogt-mfa-readonly
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test read-only evidence classifications without credentials
        run: python3 -m unittest qa.test_ogt_mfa_preflight -v
  audit:
    if: github.repository == 'romancanoniero/OGT' && github.ref == 'refs/heads/main'
    needs: [unit]
    runs-on: ubuntu-latest
    environment: ogt-launch
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google OAuth library for read-only queries
        run: python3 -m pip install 'google-auth[requests]>=2.0,<3.0'
      - name: Configure verified SSH to the existing OGT VPS
        env:
          HOST: ${{ secrets.OGT_VPS_HOST || '217.216.82.209' }}
          USER: ${{ secrets.OGT_VPS_USER || 'iankmp' }}
          KEY: ${{ secrets.OGT_VPS_SSH_KEY }}
          KNOWN: ${{ secrets.OGT_VPS_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.OGT_VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$KEY" && test -n "$KNOWN"
          [[ "$HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ogt-mfa-readonly
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf 'Host ogt-mfa-audit\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/ogt-mfa-readonly\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$HOST" "$USER" "$SSH_PORT" > ~/.ssh/config
      - name: Read Firebase MFA config and verified factor count, never change state
        env:
          TARGET_EMAIL: ${{ secrets.OGT_MFA_AUDIT_EMAIL || 'romancanoniero@gmail.com' }}
        run: |
          set -euo pipefail
          # Existing server-side service account is streamed directly into
          # the audit process stdin. It is not written to the runner filesystem,
          # uploaded as an artifact or echoed into action logs.
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes ogt-mfa-audit \
            'test -r /home/iankmp/ogt-secrets/firebase-admin.json && cat /home/iankmp/ogt-secrets/firebase-admin.json' \
            | python3 scripts/ogt_mfa_preflight.py --email "$TARGET_EMAIL"
      - name: Delete temporary runner SSH identity
        if: always()
        run: rm -f ~/.ssh/ogt-mfa-readonly ~/.ssh/known_hosts ~/.ssh/config
