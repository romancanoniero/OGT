name: OGT - primera version integrada
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Publicar app, backend y CRM en la instalacion existente; acceso privado'
        required: true
        type: choice
        default: SOLO_COMPROBAR
        options: [SOLO_COMPROBAR, PUBLICAR_PRIMERA_VERSION]
permissions:
  contents: read
concurrency:
  group: ogt-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Python syntax before browser installation
        run: python qa/run_automated_tests.py --syntax
      - name: QA automation self-tests
        run: python -m unittest discover -s qa -p 'test_qa_automation.py' -v
      - name: Source checks; no server access
        run: bash scripts/deploy-ogt-vps.sh --check
      - name: Shell syntax
        run: bash -n scripts/deploy-ogt-vps.sh scripts/activate-ogt-release.sh scripts/ogt-ios-wifi.sh
  browser:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned browser test dependencies
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Run all browser suites and preserve every failure
        run: python qa/run_automated_tests.py --browser --output "$RUNNER_TEMP/ogt-qa"
      - name: Preserve browser QA reports even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ogt-browser-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ogt-qa/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    # Only an explicitly named main-branch release may publish to the existing Contabo installation.
    needs: [checks, browser]
    if: >-
      github.ref == 'refs/heads/main' && github.repository == 'romancanoniero/OGT' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirm == 'PUBLICAR_PRIMERA_VERSION') ||
      (github.event_name == 'push' && github.event.head_commit.message == 'deploy: OGT verified CRM release 20261022'))
    runs-on: ubuntu-latest
    environment: ogt-launch
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ogt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ogt
          persist-credentials: false
      - name: Check deploy and private build dependency configuration
        env:
          HOST: ${{ secrets.OGT_VPS_HOST || '217.216.82.209' }}
          USER: ${{ secrets.OGT_VPS_USER || 'iankmp' }}
          KEY: ${{ secrets.OGT_VPS_SSH_KEY }}
          KNOWN: ${{ secrets.OGT_VPS_KNOWN_HOSTS }}
          SDK_TOKEN: ${{ secrets.OGT_SDK_READ_TOKEN || secrets.OGT_SDK_CHECKOUT_TOKEN }}
          SDK_REF: ${{ vars.OGT_SDK_REVISION || '0a881b7a15c9a7d99b77da8547aabe2dd493a8b0' }}
          SSH_PORT: ${{ vars.OGT_VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          for name in HOST USER KEY KNOWN SDK_TOKEN SDK_REF; do
            test -n "${!name}" || { echo "::error::Falta configuracion de ogt-launch: $name. Ver docs/FIRST_RELEASE.md"; exit 1; }
          done
          [[ "$HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          [[ "$SDK_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && test "$SSH_PORT" -ge 1 && test "$SSH_PORT" -le 65535
      - uses: actions/checkout@v4
        with:
          repository: romancanoniero/db-kmp-sdk
          ref: ${{ vars.OGT_SDK_REVISION || '0a881b7a15c9a7d99b77da8547aabe2dd493a8b0' }}
          token: ${{ secrets.OGT_SDK_READ_TOKEN || secrets.OGT_SDK_CHECKOUT_TOKEN }}
          path: _sdk
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Android build prerequisites
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Configure verified SSH access to the existing OGT installation
        env:
          HOST: ${{ secrets.OGT_VPS_HOST || '217.216.82.209' }}
          USER: ${{ secrets.OGT_VPS_USER || 'iankmp' }}
          KEY: ${{ secrets.OGT_VPS_SSH_KEY }}
          KNOWN: ${{ secrets.OGT_VPS_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.OGT_VPS_SSH_PORT || '22' }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ogt-release
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf 'Host ogt-release-target\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/ogt-release\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$HOST" "$USER" "$SSH_PORT" > ~/.ssh/config
      - name: Compile, test, back up, migrate and publish the same version
        env:
          OGT_VPS_HOST: ogt-release-target
          OGT_DB_KMP_SDK_PATH: ${{ github.workspace }}/_sdk
        run: bash scripts/deploy-ogt-vps.sh --deploy
      - name: Verify installed release and backend on the existing VPS
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ogt-release-target 'cat "$HOME/ogt/web-app/release.json"' > /tmp/ogt-release-check.json
          python3 - <<'PY'
          import os, json
          with open('/tmp/ogt-release-check.json') as file:
              data = json.load(file)
          assert data.get('sourceSha') == os.environ['EXPECTED_SHA'], 'Contabo SHA mismatch'
          assert data.get('scope') == 'app-backend-crms', 'Incomplete release scope'
          assert data.get('repository') == 'romancanoniero/OGT', 'Wrong repository'
          print('Contabo installed commit:', data['sourceSha'])
          PY
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ogt-release-target 'curl -fsS --max-time 15 http://127.0.0.1:19080/health >/dev/null'
          echo 'OGT backend responsive; integrated version confirmed'
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/ogt-release ~/.ssh/known_hosts ~/.ssh/config
